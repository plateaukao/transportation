plugins { id 'com.android.application' }

def signingProperties = new Properties()
def signingPropertiesFile = new File(System.getProperty('user.home'), '.android/transportation-release.properties')
if (signingPropertiesFile.exists()) signingPropertiesFile.withInputStream { signingProperties.load(it) }

android {
    namespace 'info.plateaukao.transportation'
    compileSdk 36
    defaultConfig {
        applicationId 'info.plateaukao.transportation'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }
    signingConfigs {
        release {
            if (!signingProperties.isEmpty()) {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (!signingProperties.isEmpty()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
